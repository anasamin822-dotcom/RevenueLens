name: Materialize approved RevenueLens source
on:
  push:
    branches: [feat/private-workspace]
    paths: [.github/workflows/bootstrap-revenuelens.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'anasamin822-dotcom/RevenueLens' && github.ref == 'refs/heads/feat/private-workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/private-workspace
      - name: Verify and materialize exact approved files
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/feat/private-workspace'
          assert os.environ['GITHUB_REPOSITORY']=='anasamin822-dotcom/RevenueLens'
          manifest={'README.md': '22082c764b1b342eb8d2ccc3dd09156bdb579186cd9bc6359ab3027e4287c04f', 'css/studio.css': '1dc944a18419c4ba62486be3bf003d48b2b968a8afcfa20374389ff7f0b07e73', 'docs/01-requirements.md': '594fffa6fb54e13635df16bf7d8ca2af289a001a03732ccaa7d1e6714f2d60c9', 'docs/02-scope.md': '9296b993753207da49f875ebd6240847aed70407e40242d5a48ac59efa1ee8e4', 'docs/03-architecture.md': 'a8573df3d807aea83a326276bc6d2a540c6efdae2542e7fee6854c969aae55a4', 'docs/04-data-model.md': 'ceb00d52627242ac2b10978e9ca04c8292cdbdae43790f614ceaf869b45e5009', 'docs/05-api.md': '0b0af260635dea17a5324e2c08c8bb56e2b4c1051f527ff8df2950ddfd8c822c', 'docs/06-setup.md': '4cfc0a26fa0622ef4f0aef084a1997bd13375dff944ba6d1d11adf82e2b58448', 'docs/07-ui.md': '7bbdbb3a3cabec6d3e0b7e4be05002577765e63c4607765ee0d07110a197fe79', 'docs/08-features.md': 'fe2a359b4290319a9f0aa0a213a4ee0d740ff528da87e77258989ce14e74b559', 'docs/09-validation.md': 'dc10c341aaca1b1e510fb2697f6a84449e18b0b2b1af3613293ab3fab5b0ae78', 'docs/10-security.md': 'c9a01d11656828bb238239b40a571f4697b5d56e8efce150987d62707b9aebfd', 'docs/11-testing.md': '49336ca152511d18d7076fb489c967c99094079e712dcf6c12a38512d99d3f4e', 'docs/12-accessibility.md': 'd5350e725c1948700e4359a46275044dba1ef4cebe97a6590c07d032dfb310c4', 'docs/13-deployment.md': '407dc02e3b92039e03dec556a4dba271d8c86ae13fcd2b16460a332473c8a4b8', 'docs/14-debugging.md': '02c9725b27192a221f81f68d1a1176a1728c646a87b6589daf219e88acd81422', 'docs/15-acceptance.md': '3802c158c3ac6428543ff56f22ad2c260e10bed2691d4f036216ec9e439939d6', 'docs/16-design-sources.md': '2bac1739aea4872ddf15e5dd9e0e72582dd3cf4363093779add83eae644e7bd0', 'e2e/sample-invoice.pdf': '6217dfd21f91249b5294b577ec3bb8b49bd9459a4377ab53b403892fb28cfe2c', 'index.html': '7c7984d0d1f2516459060ad2a31e62614b4e54d51210e8676dc776f96d0a28ee', 'js/workspace.js': '20a699d22bcc43557ac668bd4724fe07a08fecc51ebf0694dfc72d329f0dc326', 'package-lock.json': 'b5b517187284e8ac9192ef9f227043007d5f13dd518b935681250672b3bb0e93', 'package.json': 'cbc4f0c5d8dbf77191d264b49142267a8d4ce7a8b1a3ddbb86d6a1293bb762c2', 'scripts/cloud-auth-check.mjs': '254ae5d6c1b2941585152fe3d412c611c883e4346becd14012925dbff8b96db2', 'scripts/revenue-cloud-check.mjs': '8f11c8866be74cf1f5649d28ccfdfd012f93ed5bcc32961d84609580d4008104', 'server.js': 'd4ee377f7681805d499ea20526ee9cfa4c4e1c43d438ab9176f22755c2222389', 'supabase/001_revenuelens.sql': 'b71099f3557b470aeb694679a9c3f4ebbfb33fa5b2b37334a0fe802462f0d4f3', 'supabase/002_invoice_review_hardening.sql': '3c008bf140a16b50cc71575dc1805ef9240a844a63d94da4cd394f9c03e5698b', 'supabase/003_invoice_storage_owner_fix.sql': '5e06384ed66fb37d363d007dc294f0175e9fa408201bf418faa211bb33652c9b', 'tests/browser-workflow.cjs': '361e618a2559ccf74197e26ef936becd2d4416dc30e7522771382925da6a409b', 'tests/preview.cjs': 'bfad1f729a33ada758943a5b9044e4d6af402fa40561cba922b0a14173b2ef16'}
          compressed=base64.b64decode('')
          assert hashlib.sha256(compressed).hexdigest()=='40adc4a1914ef791a13e3db578c36283b8c7c1ba105695d78929ed704ba3b237'
          files=json.loads(gzip.decompress(compressed))
          assert set(files)==set(manifest)
          root=pathlib.Path.cwd().resolve()
          for name,expected in manifest.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and '.github' not in p.parts
              target=root.joinpath(*p.parts)
              assert target.resolve().is_relative_to(root)
              assert not target.is_symlink()
              data=base64.b64decode(files[name],validate=True)
              assert hashlib.sha256(data).hexdigest()==expected
          for name in manifest:
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(files[name],validate=True))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Complete RevenueLens private analytics workspace and verified documentation'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/private-workspace'],check=True)
