<!DOCTYPE html>
<html lang="en">
<head>

        var b = document.querySelector('base');

      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | RevenueLens Analytics</title>
  <meta name="description" content="The requested dashboard view or analytics resource could not be found.">
  <link rel="canonical" href="404.html">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">

  <!-- Open Graph / Social Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="404 — Page Not Found | RevenueLens Analytics">
  <meta property="og:description" content="The requested dashboard view or analytics resource could not be found.">
  <meta property="og:image" content="assets/og-preview.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="404 — Page Not Found | RevenueLens Analytics">
  <meta name="twitter:description" content="The requested dashboard view or analytics resource could not be found.">
  <meta name="twitter:image" content="assets/og-preview.png">

  <!-- Favicon (Inline SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Anti-flash Theme Initializer -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('sr_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }
    .error-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 3.5rem 2rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-glass);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
      cursor: default;
      user-select: none;
      min-width: 3ch;
      display: inline-block;
    }
    .error-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .error-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent-primary);
      color: #ffffff;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-return:hover {
      background: var(--accent-primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-canvas">
  <!-- Ambient Aurora Drift & Connected Particles -->
  <div class="ambient-aurora-wrap" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
    <div class="ambient-noise"></div>
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>
  </div>

  <div class="error-container">
    <div class="error-card">
      <div class="brand-icon" style="width: 48px; height: 48px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="error-code" id="error-code-404">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The analytics module or page you were looking for doesn't exist or has been relocated within the RevenueLens platform.</p>
      <a href="index.html" class="btn-return">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to Dashboard
      </a>
    </div>
  </div>

  <!-- Connected Ambient Particles -->
  <script src="js/particles.js"></script>

  <!-- Fun Text Scramble on '404' -->
  <script>
    (function () {
      const el = document.getElementById('error-code-404');
      if (!el) return;
      const targetText = '404';
      const chars = '0123456789ABCDEF$#%*!@';
      let frame = 0;
      let interval = null;

      function scramble() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          el.textContent = targetText;
          return;
        }
        clearInterval(interval);
        frame = 0;
        interval = setInterval(() => {
          let output = '';
          for (let i = 0; i < targetText.length; i++) {
            if (frame > i * 6 + 8) {
              output += targetText[i];
            } else {
              output += chars[Math.floor(Math.random() * chars.length)];
            }
          }
          el.textContent = output;
          frame++;
          if (frame > targetText.length * 6 + 12) {
            clearInterval(interval);
            el.textContent = targetText;
          }
        }, 36);
      }

      scramble();
      el.addEventListener('mouseenter', scramble);
    })();
  </script>
</body>
</html>
